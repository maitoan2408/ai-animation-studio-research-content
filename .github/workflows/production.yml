name: Q2 workbench verification
on:
  pull_request:
    paths: ['production/**', 'src/**', 'web/**', 'tests/m3-*.ts', 'scripts/m3-*.ts', 'examples/m3-*.json', 'package*.json', 'scripts/run-step.py', 'scripts/m2-product-e2e.ts', 'examples/m2-new-story.txt', '.github/workflows/production.yml']
  push:
    branches: [main]
    paths: ['production/**', 'src/**', 'web/**', 'tests/m3-*.ts', 'scripts/m3-*.ts', 'examples/m3-*.json', 'package*.json', 'scripts/run-step.py', '.github/workflows/production.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: q2-workbench-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts-and-review:
    runs-on: ubuntu-latest
    container: node:24.22.1-trixie@sha256:65f2a832ba8374f622bf691e122d556692861f4a63759c3b7120356d4460e95c
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install local media runtime
        run: apt-get update && apt-get install -y --no-install-recommends chromium ffmpeg librsvg2-bin fonts-liberation python3 python3-venv
      - run: npm --prefix production ci
      - name: Install locked QC libraries
        run: |
          python3 -m venv /tmp/q2-qc
          /tmp/q2-qc/bin/pip install -r production/requirements-qc.lock
      - run: npm --prefix production run typecheck
      - run: npm --prefix production test
      - name: Compare physics bakes with locked cross-runner reference
        run: |
          npm --prefix production run physics:spike
          PATH="/tmp/q2-qc/bin:$PATH" /tmp/q2-qc/bin/python production/src/qa/check_quality_diagnostics.py
      - run: /tmp/q2-qc/bin/python -m unittest discover -s production/tests -p 'test_*.py' -v
      - name: Restore exact review media from Git parts
        run: /tmp/q2-qc/bin/python production/src/media/review_bundle.py restore production/artifacts/Q2/web-review-v2
      - run: npm --prefix production run review -- check
      - name: Verify frozen chart in actual Chromium
        run: /tmp/q2-qc/bin/python production/src/qa/check_color_reference.py
      - run: npm --prefix production run test:review-ui
      - name: Rebuild R3 from committed inputs and verify review binding
        run: |
          /tmp/q2-qc/bin/python production/src/media/rebuild_r3.py
          npm --prefix production run review:r3 -- check
          npm --prefix production run test:review-r3
      - name: Verify delayed and uncertain review-save recovery
        run: npm --prefix production run test:review-recovery
      - name: Verify standalone Git-only installation and review workflow
        # Full-repo npm ci passed before EX-028 was fixed. This separate checkout
        # must remain outside the parent package tree, with its own empty cache.
        run: PATH="/tmp/q2-qc/bin:$PATH" /tmp/q2-qc/bin/python production/src/qa/check_fresh_review.py
      - name: M3 native character-motion showcase (1080p + contact/seek gates)
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -d production/out/art-q1 ]; then mv production/out/art-q1 production/out/art-q1-before-m3; fi
          npm --prefix production run motion:m3
      - name: M1 production IR independent real Three video (native-art + 1080p still parity)
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          production/node_modules/.bin/tsx production/src/art/preview.ts
          production/node_modules/.bin/tsx production/src/render/render-ir.ts
      - name: M3 required independent post-result provenance and media audit
        run: npm --prefix production run motion:m3:audit
      - name: M3 Studio real editor, saved revision and custom native film
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          npm ci
          npx tsx scripts/m3-studio-e2e.ts
      - name: Independent M3 Studio post-result QA
        run: npx tsx scripts/m3-studio-audit.ts
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: q2-workbench-${{ github.run_number }}
          path: |
            production/out/review-ui/
            production/out/product-first/m1/
            production/out/product-first/m3/
            artifacts/product-first/m3-studio/
            production/out/review-audit/
            production/out/player-check/
            production/out/chart-results/
            production/out/fresh-review/**/report.json
            production/out/physics-spike/**/report.json
            production/out/quality-hero/**/critic.json
            production/out/quality-hero/**/failure.json
            production/out/quality-diagnostics/**/manifest.json
            production/out/quality-diagnostics/**/workflow.json
            production/out/quality-diagnostics/**/contact-sheet.jpg
            production/out/quality-diagnostics/**/*.svg
          retention-days: 14
