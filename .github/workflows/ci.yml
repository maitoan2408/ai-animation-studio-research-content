name: Paper Studio verification
on:
  pull_request:
  push:
    branches: [main, 'codex/product-first-skill-architecture']
    paths: ['src/**', 'web/**', 'tests/**', 'scripts/verify-review-evidence.mjs', 'examples/**', 'package*.json', 'tsconfig*.json', '.prettier*', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    container: node:24.22.1-trixie@sha256:65f2a832ba8374f622bf691e122d556692861f4a63759c3b7120356d4460e95c
    timeout-minutes: 40
    env:
      STUDIO_BROWSER: /usr/bin/chromium
      HYPERFRAMES_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install media runtime
        run: apt-get update && apt-get install -y --no-install-recommends chromium ffmpeg fonts-liberation
      - run: npm ci
      - run: npm run studio -- doctor
      - name: Print Prettier-normalized M2 sources for code review (temporary)
        run: |
          printf 'M2_RENDER_FORMAT_B64='
          npx prettier src/render.ts | base64 -w0
          printf '\nM2_SCRIPT_FORMAT_B64='
          npx prettier scripts/m2-product-e2e.ts | base64 -w0
          printf '\n'
      - run: npm run verify
      - run: npm run build
      - run: npm run test:integration
      - run: npm run test:ui
      - run: npm run test:ui:recovery
      - name: Verify M0 baseline video and publish review contact sheets
        run: node scripts/verify-review-evidence.mjs
      - name: M1 legacy vs IR real video/audio parity
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npx tsx scripts/render-ir-ab.ts
      - name: M2 real 3-shot edited 1080p production video + UI + voice acceptance
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npx tsx scripts/m2-product-e2e.ts
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paper-studio-${{ github.run_number }}
          path: |
            artifacts/
            /tmp/studio-integration-*/tmp/**/render-log.json
            /tmp/studio-integration-*/tmp/**/failure.json
          retention-days: 14
