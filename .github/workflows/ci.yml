name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    container: node:24.22.1-trixie@sha256:65f2a832ba8374f622bf691e122d556692861f4a63759c3b7120356d4460e95c
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: apt-get update && apt-get install -y --no-install-recommends chromium ffmpeg fonts-liberation
      - run: npm ci && npm --prefix production ci
      - name: Studio (format, typecheck, unit tests, build)
        run: npm run verify && npm run build
      - name: Studio browser flows
        run: npm run test:ui && npm run test:ui:recovery
      - name: Production engine (typecheck, tests)
        run: npm --prefix production run typecheck && npm --prefix production test
